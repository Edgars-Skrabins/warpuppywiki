name: Deploy

on:
  push:
    branches: [deployment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm data:sync
      - name: Compute the asset cache key
        id: cache-key
        run: echo "key=wardogs-full-$(jq -r .latest public/data/builds.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/warpuppywiki
          key: ${{ steps.cache-key.outputs.key }}
      - run: pnpm assets:sync --max-zoom 6
      - run: pnpm build
      - run: pnpm exec tsx scripts/write-deploy-info.ts
      - name: Configure Pages
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v6
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
